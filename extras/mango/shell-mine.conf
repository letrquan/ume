# My own shell (~/.config/quickshell/mine) WITHOUT Noctalia. Loaded through
# ./shell.conf when `mango-shell mine` is active (see ~/.local/bin/mango-shell).
# Everything is my shell: bar, dock, notifications, launcher, clipboard,
# control center, power menu, password dialog, wallpaper and colors, OSD,
# screenshots, locking before sleep (hypridle). Back to Noctalia:
# `mango-shell noctalia`, then log out and in.
# The `mine <x>` key commands below fall back to Noctalia; here that just
# does nothing when my shell isn't running (`mine restart` brings it back).

# ---- Autostart ---------------------------------------------------------------
# My shell, kept running: `mine start` runs it through its keeper
# (scripts/shell-keeper.sh), which starts it again after a crash or a hang,
# not after `mine stop` / `mine restart`, and ends at logout. qs still gets
# the jemalloc settings (MALLOC_CONF, set in ~/.local/bin/mine).
exec_once=~/.local/bin/mine start
# The lock's backup: locks before sleep and after a long idle when the shell
# can't (crashed, hung, not running). Its own process, apart from the shell.
exec_once=~/.config/quickshell/mine/scripts/lock-guard.sh
# Phone link (KDE Connect; the shell's Phone tile and bar item). mango
# doesn't run ~/.config/autostart. Nothing happens until kdeconnect is installed.
exec_once=/usr/bin/kdeconnectd

# ---- Colors ------------------------------------------------------------------
# Window borders follow the wallpaper: my shell (services/Wallpaper.qml)
# writes ./noctalia-colors.conf from its matugen colors and reloads mango.
source=./noctalia-colors.conf

# ---- Blur --------------------------------------------------------------------
# Frosted glass behind my shell's islands, dock, panels and OSD. mango blurs
# every pixel of a layer that isn't fully transparent. blur_optimized=1:
# panels show the blurred wallpaper, not the windows under them (cheap).
blur_layer=1
blur_optimized=1
# Full-screen opaque layers with nothing behind them to blur.
layer_rule=no_blur:1,layer_name:^mine-wallpaper$
layer_rule=no_blur:1,layer_name:^mine-screenshot$
# The desktop clock: text on the wallpaper, nothing to frost.
layer_rule=no_blur:1,layer_name:^mine-desktop$
# The power menu, the cheat sheet, the password dialog, the notification
# center, the OSD and the Alt+Tab switcher draw their blur themselves (the
# shell's common/Backdrop.qml and WallpaperFrost.qml): mango's blur can't
# fade, so it popped in at full strength on their first frame and stayed
# until their last.
layer_rule=no_blur:1,layer_name:^mine-(session|cheatsheet|polkit|notification-center|osd|switcher)$

# ---- Keys --------------------------------------------------------------------
# Launcher: tap Super. My shell's launcher, or Noctalia's when my shell
# isn't running (see ~/.local/bin/mine).
bindr=SUPER,Super_L,spawn,~/.local/bin/mine launcher
# Clipboard history: my shell's, or Noctalia's when my shell isn't running.
bind=SUPER,v,spawn,~/.local/bin/mine clipboard
# Settings: my shell's (Style.qml in your editor), or Noctalia's.
bind=SUPER,comma,spawn,~/.local/bin/mine settings
# Control center (Wi-Fi, Bluetooth, sound, brightness, media...): my shell's,
# or Noctalia's when my shell isn't running (see ~/.local/bin/mine).
bind=SUPER,n,spawn,~/.local/bin/mine control-center
# Wallpaper picker: my shell's, or Noctalia's when my shell isn't running.
bind=SUPER,y,spawn,~/.local/bin/mine wallpaper
# Power menu: my shell's, or Noctalia's when my shell isn't running.
bind=SUPER,x,spawn,~/.local/bin/mine session
# Lock: the Quickshell lock screen (~/.config/quickshell/lock); qs-lock falls
# back to hyprlock if it can't start.
bindl=SUPER+ALT,l,spawn,~/.local/bin/qs-lock

# Screenshots: my shell's (freeze, then drag a region or click a window;
# Ctrl+Print = whole screen), or Noctalia's when my shell isn't running.
bind=none,Print,spawn,~/.local/bin/mine screenshot region
bind=SUPER+SHIFT,s,spawn,~/.local/bin/mine screenshot region
bind=CTRL,Print,spawn,~/.local/bin/mine screenshot screen
# Copy the text in a region (OCR).
bind=SUPER+SHIFT,t,spawn,~/.local/bin/mine screenshot text

# Screen recording: my shell's (a red dot with the time shows in the bar;
# the same key, or a click on the dot, stops it).
bind=SUPER+SHIFT,r,spawn,~/.local/bin/mine record screen
bind=SUPER+ALT,r,spawn,~/.local/bin/mine record region
# Color picker: click anywhere, the hex is copied (Esc cancels).
bind=SUPER+SHIFT,c,spawn,~/.local/bin/mine picker
# hyprpicker's frozen full-screen layer is opaque: nothing behind it to blur.
layer_rule=no_blur:1,no_animation:1,layer_name:^hyprpicker$

# Every keyboard shortcut, searchable.
bind=SUPER,slash,spawn,~/.local/bin/mine cheatsheet

# Audio / media / brightness (also work on the lock screen): my shell's, or
# Noctalia's when my shell isn't running.
bindl=none,XF86AudioRaiseVolume,spawn,~/.local/bin/mine key volume-up
bindl=none,XF86AudioLowerVolume,spawn,~/.local/bin/mine key volume-down
bindl=none,XF86AudioMute,spawn,~/.local/bin/mine key volume-mute
bindl=none,XF86AudioMicMute,spawn,~/.local/bin/mine key mic-mute
bindl=none,XF86AudioPlay,spawn,~/.local/bin/mine key play
bindl=none,XF86AudioPrev,spawn,~/.local/bin/mine key previous
bindl=none,XF86AudioNext,spawn,~/.local/bin/mine key next
bindl=none,XF86MonBrightnessUp,spawn,~/.local/bin/mine key brightness-up
bindl=none,XF86MonBrightnessDown,spawn,~/.local/bin/mine key brightness-down

# ---- Tablet mode ----------------------------------------------------------------
# On-screen keyboard: folding the screen back shows it, folding it again hides
# it. mango fires fold/unfold for the lid too and stops at the first match, so
# any other lid action must go into these same commands. `mine osk fold`
# skips a fold while the lid is shut (that one is the lid). Log: $XDG_RUNTIME_DIR/mine-osk.log
switchbind=fold,spawn,~/.local/bin/mine osk fold
switchbind=unfold,spawn,~/.local/bin/mine osk unfold
# The pen follows the built-in screen (and its turn, when the shell turns it
# in tablet mode: services/AutoRotate.qml). Touch already does.
device_rule=type:tablet,monitor:eDP-1
